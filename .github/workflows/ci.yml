# CI for the three core apps: ae-node (protocol), ae-app (wallet), ae-miner (dashboard).
#
# One job per app. Every push to main and every pull request runs them, so a
# broken change can't merge silently. platform-server has its own workflow
# (platform-server.yml); this file deliberately does not touch it.
#
# ae-node is the money + consensus core: it builds (tsc) and runs the full
# node:test suite. The frontends lint and type-check via their build step.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ae-node:
    name: ae-node (build + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ae-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ae-node/package-lock.json
      - run: npm ci
      - run: npm run build
      # Blocking gate: the deterministic suite (money, court, verification,
      # mining, crypto, rebase, tagging, API). This must always pass.
      - run: npm test
      # Non-blocking: the multi-runner BFT/consensus/sync E2E tests. They pass
      # locally but are timing-flaky on shared CI runners (fixed wait() delays).
      # Run them for visibility without gating merges. Stabilizing them with
      # event-based waits so they can rejoin the gate is tracked as D9.
      - run: npm run test:e2e
        continue-on-error: true

  ae-app:
    name: ae-app (lint)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ae-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ae-app/package-lock.json
      # --legacy-peer-deps: vite-plugin-pwa lags vite 8 on its peer range.
      # Pre-existing conflict; tracked for a proper dependency bump in the plan.
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      # Build is intentionally omitted: a clean checkout can't resolve the
      # sibling @alignmenteconomy/sdk workspace package, and tsc surfaces
      # pre-existing catch-variable type errors that local incremental builds
      # masked. Restoring the build here is tracked as D8 in the plan.

  ae-miner:
    name: ae-miner (lint + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ae-miner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ae-miner/package-lock.json
      # --legacy-peer-deps: vite-plugin-pwa lags vite 8 on its peer range.
      # Pre-existing conflict; tracked for a proper dependency bump in the plan.
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
